name: Build LLVM/Clang (Multi-Architecture Android / Linux)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact Android Clang revision (or 'all' for full matrix)"
        required: true
        default: "clang-r487747e"
        type: choice
        options:
          - "all"
          - "clang-r487747c"
          - "clang-r487747d"
          - "clang-r487747e"
          - "clang-r522817"
          - "clang-r522817b"
          - "clang-r522817c"
          - "clang-r522817d"
          - "clang-r530567b"
          - "clang-r530567d"
          - "clang-r530567e"
          - "clang-r563880c"
          - "clang-r574158c"
      target:
        description: "Host execution target architecture (or 'all' for all 4 archs)"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "aarch64"
          - "armv7a"
          - "x86_64"
          - "i686"
          - "aarch64-linux-android"
          - "armv7a-linux-androideabi"
          - "x86_64-linux-android"
          - "i686-linux-android"
          - "aarch64-linux-gnu"
          - "armv7a-linux-gnueabihf"
          - "x86_64-linux-gnu"
          - "i686-linux-gnu"
      platform:
        description: "Host execution platform"
        required: true
        default: "bionic"
        type: choice
        options:
          - "bionic"
          - "linux"
  push:
    tags:
      - "llvm-*"

permissions:
  contents: write
  packages: read

jobs:
  matrix-init:
    name: Initialize Build Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      platform: ${{ steps.set-matrix.outputs.platform }}
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Compute Matrix
        id: set-matrix
        run: |
          PLATFORM="${{ inputs.platform || 'bionic' }}"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          python3 -c "
          import yaml, json, os

          event = os.environ.get('GITHUB_EVENT_NAME', '')
          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          input_rev = '${{ inputs.revision }}'
          input_target = '${{ inputs.target }}'
          platform = '$PLATFORM'

          with open('metadata/llvm-releases.yaml') as f:
              data = yaml.safe_load(f)
          all_revs = [x['revision'] for x in data['releases']]

          host_platforms = data.get('supported_host_platforms', {})
          all_targets = host_platforms.get(platform, {}).get('targets', [])
          if not all_targets:
              if platform == 'linux':
                  all_targets = ['aarch64-linux-gnu', 'armv7a-linux-gnueabihf', 'x86_64-linux-gnu', 'i686-linux-gnu']
              else:
                  all_targets = ['aarch64-linux-android', 'armv7a-linux-androideabi', 'x86_64-linux-android', 'i686-linux-android']

          if platform == 'linux':
              target_map = {
                  'aarch64': 'aarch64-linux-gnu',
                  'armv7a': 'armv7a-linux-gnueabihf',
                  'x86_64': 'x86_64-linux-gnu',
                  'i686': 'i686-linux-gnu',
              }
          else:
              target_map = {
                  'aarch64': 'aarch64-linux-android',
                  'armv7a': 'armv7a-linux-androideabi',
                  'x86_64': 'x86_64-linux-android',
                  'i686': 'i686-linux-android',
              }

          if event == 'push' and ref_name.startswith('llvm-'):
              revs = ['clang-' + ref_name[5:]]
              targets = all_targets
          elif input_rev == 'all':
              revs = all_revs
          else:
              revs = [input_rev or 'clang-r487747e']

          if input_target == 'all' or not input_target:
              targets = all_targets
          elif input_target in target_map:
              targets = [target_map[input_target]]
          else:
              targets = [input_target]

          matrix = [{'revision': r, 'target': t} for r in revs for t in targets]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'matrix={json.dumps(matrix)}\n')
          "

  build-llvm:
    name: Build LLVM ${{ matrix.revision }} (${{ matrix.target }})
    needs: matrix-init
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix-init.outputs.matrix) }}
    steps:
      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache
          sudo docker system prune -af --volumes || true
          echo "Disk space after cleanup:"
          df -h

      - name: Configure Swap
        run: |
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: llvm-ccache-${{ matrix.revision }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            llvm-ccache-${{ matrix.revision }}-${{ matrix.target }}-
            llvm-ccache-${{ matrix.revision }}-
            llvm-ccache-

      - name: Set up QEMU
        if: matrix.target != 'x86_64-linux-android' && matrix.target != 'x86_64-linux-gnu'
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Revision and Tag
        id: meta
        run: |
          REV="${{ matrix.revision }}"
          TAG="llvm-${REV#clang-}"
          PLATFORM="${{ needs.matrix-init.outputs.platform }}"
          TARGET="${{ matrix.target }}"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Building revision: $REV ($TARGET) with tag: $TAG (Platform: $PLATFORM)"

      - name: Resolve Builder Docker Image
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/apex-toolchains-builder:latest"
          echo "BUILDER_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          if docker pull "$IMAGE"; then
            echo "Successfully pulled $IMAGE from GHCR."
          else
            echo "GHCR image not found or inaccessible; building locally from docker/Dockerfile..."
            docker build -t "$IMAGE" -f docker/Dockerfile docker/
          fi

      - name: Build LLVM/Clang in Docker Container
        run: |
          mkdir -p build .ccache
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            --user "$(id -u):$(id -g)" \
            -e HOME=/work \
            -e CCACHE_DIR=/work/.ccache \
            "$BUILDER_IMAGE" \
            scripts/build-llvm.sh \
              --revision="${{ steps.meta.outputs.revision }}" \
              --target="${{ steps.meta.outputs.target }}" \
              --platform="${{ steps.meta.outputs.platform }}" \
              --jobs="$(nproc)"

      - name: Verify LLVM ELF & Functionality in Docker Container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            --user "$(id -u):$(id -g)" \
            -e HOME=/work \
            "$BUILDER_IMAGE" \
            scripts/verify-llvm.sh \
              --dir="build/${{ steps.meta.outputs.revision }}-${{ steps.meta.outputs.target }}/install" \
              --revision="${{ steps.meta.outputs.revision }}" \
              --target="${{ steps.meta.outputs.target }}" \
              --platform="${{ steps.meta.outputs.platform }}"

      - name: Generate Release Notes
        run: |
          REV="${{ steps.meta.outputs.revision }}"
          TAG="${{ steps.meta.outputs.tag }}"
          TARGET="${{ steps.meta.outputs.target }}"
          PLATFORM="${{ steps.meta.outputs.platform }}"
          mkdir -p build
          cat <<EOF > build/RELEASE_NOTES.md
          ## Custom LLVM/Clang — ${REV} (${TARGET})

          - **Git Tag:** \`${TAG}\`
          - **Host Platform:** \`${PLATFORM}\`
          - **Host Target:** \`${TARGET}\` (Native execution on this Android/Linux architecture)
          - **Multi-Arch Code Generation:** Capable of cross-compiling to \`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`, \`x86\`, and \`riscv64\`.
          EOF

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "LLVM ${{ steps.meta.outputs.revision }}"
          body_path: build/RELEASE_NOTES.md
          files: |
            build/artifacts/custom-llvm-*.tar.xz
            build/artifacts/custom-llvm-*.tar.xz.sha256
          draft: false
          prerelease: false
