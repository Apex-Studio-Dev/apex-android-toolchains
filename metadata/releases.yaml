# Apex Android Toolchains - Unified Releases Matrix
# Host: Linux ARM64 (aarch64)
# Targets: Android ARM64 (aarch64-linux-android), Android ARM32 (arm-linux-androideabi)

project:
  name: "apex-android-toolchains"
  description: "Monorepo for Custom Android LLVM/Clang and Custom Android NDK for Linux ARM64 Host"
  host_architecture: "aarch64"
  host_platform: "linux-arm64"
  target_architectures:
    - name: "Android ARM64"
      triple: "aarch64-linux-android"
      abi: "arm64-v8a"
    - name: "Android ARM32"
      triple: "arm-linux-androideabi"
      abi: "armeabi-v7a"

dependency_pipeline:
  - step: 1
    name: "fetch_source"
    description: "Fetch exact AOSP llvm-project commit and downstream patches"
  - step: 2
    name: "build_llvm"
    description: "Build native Linux ARM64 LLVM/Clang toolchain"
  - step: 3
    name: "package_llvm"
    description: "Validate ELF AArch64 and create custom-llvm-*.tar.xz with SHA256/SHA512"
  - step: 4
    name: "release_llvm"
    description: "Publish to GitHub & GitLab releases with git tag llvm-*"
  - step: 5
    name: "fetch_llvm_artifact"
    description: "NDK fetches pre-released LLVM artifact without recompilation"
  - step: 6
    name: "assemble_ndk"
    description: "Build host tools (make/yasm/toolbox), splice ARM64 LLVM into official NDK base"
  - step: 7
    name: "verify_ndk"
    description: "Compile hello.c for aarch64-linux-android30 and arm-linux-androideabi30; check ELF headers"
  - step: 8
    name: "release_ndk"
    description: "Package custom-android-ndk-*.tar.xz and publish with git tag ndk-*"

artifact_patterns:
  ndk: "custom-android-ndk-{release}-{target}.tar.xz"
  llvm: "custom-llvm-{revision}-{target}.tar.xz"

matrix:
  - ndk_release: "r26"
    ndk_tag: "ndk-r26"
    llvm_revision: "clang-r487747c"
    llvm_tag: "llvm-r487747c"
    llvm_major: 17

  - ndk_release: "r26b"
    ndk_tag: "ndk-r26b"
    llvm_revision: "clang-r487747d"
    llvm_tag: "llvm-r487747d"
    llvm_major: 17

  - ndk_release: "r26c"
    ndk_tag: "ndk-r26c"
