name: Build Custom Android NDK (ARM64 / Bionic)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Android NDK Release version"
        required: true
        default: "r26d"
        type: choice
        options:
          - "r26"
          - "r26b"
          - "r26c"
          - "r26d"
          - "r27"
          - "r27b"
          - "r27c"
          - "r27d"
          - "r28"
          - "r28b"
          - "r28c"
          - "r29"
          - "r30"
      platform:
        description: "Host execution platform"
        required: true
        default: "bionic"
        type: choice
        options:
          - "bionic"
          - "linux"
      rebuild_llvm:
        description: "Force local compilation of LLVM instead of using released artifact"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "ndk-*"

permissions:
  contents: write
  packages: read

jobs:
  build-ndk:
    name: Build NDK ${{ inputs.release || github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120
          swap-size-mb: 5120
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          build-mount-path: /mnt

      - name: Move Docker to /mnt
        run: |
          sudo systemctl stop docker.socket docker.service
          sudo mkdir -p /mnt/docker
          sudo rsync -aqP /var/lib/docker/ /mnt/docker/
          sudo rm -rf /var/lib/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker

      - name: Prepare /mnt/build
        run: |
          sudo mkdir -p /mnt/build
          sudo chown $(id -u):$(id -g) /mnt/build
          rm -rf "$GITHUB_WORKSPACE"
          ln -s /mnt/build "$GITHUB_WORKSPACE"

      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Release and Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            REL="${TAG#ndk-}"
          else
            REL="${{ inputs.release }}"
            TAG="ndk-$REL"
          fi
          PLATFORM="${{ inputs.platform || 'bionic' }}"
          REBUILD="${{ inputs.rebuild_llvm || false }}"
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "rebuild_llvm=$REBUILD" >> "$GITHUB_OUTPUT"
          echo "Assembling NDK: $REL with tag: $TAG (Platform: $PLATFORM)"

      - name: Resolve Builder Docker Image
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/apex-toolchains-builder:latest"
          echo "BUILDER_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          if ! docker pull "$IMAGE"; then
            echo "GHCR image not found or inaccessible; building locally from docker/Dockerfile..."
            docker build -t "$IMAGE" -f docker/Dockerfile docker/
          fi

      - name: Build / Assemble Custom NDK in Docker Container
        run: |
          ARGS=( "--release=${{ steps.meta.outputs.release }}" "--platform=${{ steps.meta.outputs.platform }}" )
          if [ "${{ steps.meta.outputs.rebuild_llvm }}" = "true" ]; then
            ARGS+=( "--rebuild-llvm" )
          fi
          docker run --rm \
            -v "/mnt/build:/work" \
            -w /work \
            --user "$(id -u):$(id -g)" \
            -e HOME=/work \
            "$BUILDER_IMAGE" \
            scripts/build-ndk.sh "${ARGS[@]}"

      - name: Verify Cross-Compilation (ARM64 & ARM32) in Docker Container
        run: |
          NDK_DIR="$(find build/ndk-${{ steps.meta.outputs.release }}/official-ndk -maxdepth 1 -mindepth 1 -type d -name 'android-ndk-*' | head -n 1)"
          docker run --rm \
            -v "/mnt/build:/work" \
            -w /work \
            --user "$(id -u):$(id -g)" \
            -e HOME=/work \
            "$BUILDER_IMAGE" \
            scripts/verify-ndk.sh \
              --ndk="$NDK_DIR" \
              --release="${{ steps.meta.outputs.release }}"

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Custom Android NDK ${{ steps.meta.outputs.release }} (Linux ARM64 / Bionic)"
          files: |
            build/artifacts/custom-android-ndk-*.tar.xz
            build/artifacts/*.sha256
            build/artifacts/*.sha512
            build/artifacts/SHA256SUMS
            build/artifacts/SHA512SUMS
          draft: false
          prerelease: false
