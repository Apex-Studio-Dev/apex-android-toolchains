name: Build Custom Android NDK (Multi-Architecture Android / Linux)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Android NDK Release version (or 'all' for full matrix)"
        required: true
        default: "r26d"
        type: choice
        options:
          - "all"
          - "r26"
          - "r26b"
          - "r26c"
          - "r26d"
          - "r27"
          - "r27b"
          - "r27c"
          - "r27d"
          - "r28"
          - "r28b"
          - "r28c"
          - "r29"
          - "r30"
      target:
        description: "Host execution target architecture (or 'all' for all 4 archs)"
        required: true
        default: "aarch64-linux-android"
        type: choice
        options:
          - "all"
          - "aarch64-linux-android"
          - "armv7a-linux-androideabi"
          - "x86_64-linux-android"
          - "i686-linux-android"
      platform:
        description: "Host execution platform"
        required: true
        default: "bionic"
        type: choice
        options:
          - "bionic"
          - "linux"
      rebuild_llvm:
        description: "Force local compilation of LLVM instead of using released artifact"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "ndk-*"

permissions:
  contents: write
  packages: read

jobs:
  matrix-init:
    name: Initialize NDK Build Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      platform: ${{ steps.set-matrix.outputs.platform }}
      rebuild_llvm: ${{ steps.set-matrix.outputs.rebuild_llvm }}
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Compute Matrix
        id: set-matrix
        run: |
          PLATFORM="${{ inputs.platform || 'bionic' }}"
          REBUILD="${{ inputs.rebuild_llvm || false }}"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "rebuild_llvm=$REBUILD" >> "$GITHUB_OUTPUT"
          python3 -c "
          import yaml, json, os

          event = os.environ.get('GITHUB_EVENT_NAME', '')
          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          input_rel = '${{ inputs.release }}'
          input_target = '${{ inputs.target }}'

          with open('metadata/ndk-releases.yaml') as f:
              data = yaml.safe_load(f)
          all_rels = [x['release'] for x in data['releases']]
          all_targets = ['aarch64-linux-android', 'armv7a-linux-androideabi', 'x86_64-linux-android', 'i686-linux-android']

          if event == 'push' and ref_name.startswith('ndk-'):
              rels = [ref_name[4:]]
              targets = all_targets
          elif input_rel == 'all':
              rels = all_rels
          else:
              rels = [input_rel or 'r26d']

          if input_target == 'all' or not input_target:
              targets = all_targets
          else:
              targets = [input_target]

          matrix = [{'release': r, 'target': t} for r in rels for t in targets]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'matrix={json.dumps(matrix)}\n')
          "

  build-ndk:
    name: Build NDK ${{ matrix.release }} (${{ matrix.target }})
    needs: matrix-init
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix-init.outputs.matrix) }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120
          swap-size-mb: 5120
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          build-mount-path: /mnt

      - name: Move Docker to /mnt
        run: |
          sudo systemctl stop docker.socket docker.service
          sudo mkdir -p /mnt/docker
          sudo rsync -aqP /var/lib/docker/ /mnt/docker/
          sudo rm -rf /var/lib/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker

      - name: Prepare /mnt/build
        run: |
          sudo mkdir -p /mnt/build
          sudo chown $(id -u):$(id -g) /mnt/build
          rm -rf "$GITHUB_WORKSPACE"
          ln -s /mnt/build "$GITHUB_WORKSPACE"

      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Release and Tag
        id: meta
        run: |
          REL="${{ matrix.release }}"
          TAG="ndk-$REL"
          PLATFORM="${{ needs.matrix-init.outputs.platform }}"
          REBUILD="${{ needs.matrix-init.outputs.rebuild_llvm }}"
          TARGET="${{ matrix.target }}"
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "rebuild_llvm=$REBUILD" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Assembling NDK: $REL ($TARGET) with tag: $TAG (Platform: $PLATFORM)"

      - name: Resolve Builder Docker Image
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/apex-toolchains-builder:latest"
          echo "BUILDER_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          if docker pull "$IMAGE"; then
            echo "Successfully pulled $IMAGE from GHCR."
          else
            echo "GHCR image not found or inaccessible; building locally from docker/Dockerfile..."
            docker build -t "$IMAGE" -f docker/Dockerfile docker/
          fi

      - name: Build / Assemble Custom NDK in Docker Container
        run: |
          ARGS=( "--release=${{ steps.meta.outputs.release }}" "--target=${{ steps.meta.outputs.target }}" "--platform=${{ steps.meta.outputs.platform }}" )
          if [ "${{ steps.meta.outputs.rebuild_llvm }}" = "true" ]; then
            ARGS+=( "--rebuild-llvm" )
          fi
          docker run --rm \
            -v "/mnt/build:/work" \
            -w /work \
            --user "$(id -u):$(id -g)" \
            -e HOME=/work \
            "$BUILDER_IMAGE" \
            scripts/build-ndk.sh "${ARGS[@]}"

      - name: Verify Cross-Compilation in Docker Container
        run: |
          NDK_DIR="$(find build/ndk-${{ steps.meta.outputs.release }}-${{ steps.meta.outputs.target }}/official-ndk -maxdepth 1 -mindepth 1 -type d -name 'android-ndk-*' | head -n 1)"
          docker run --rm \
            -v "/mnt/build:/work" \
            -w /work \
            --user "$(id -u):$(id -g)" \
            -e HOME=/work \
            "$BUILDER_IMAGE" \
            scripts/verify-ndk.sh \
              --ndk="$NDK_DIR" \
              --release="${{ steps.meta.outputs.release }}"

      - name: Generate Release Notes
        run: |
          REL="${{ steps.meta.outputs.release }}"
          TAG="${{ steps.meta.outputs.tag }}"
          TARGET="${{ steps.meta.outputs.target }}"
          mkdir -p build
          cat <<EOF > build/RELEASE_NOTES.md
          ## Custom Android NDK — ${REL} (${TARGET})

          - **Git Tag:** \`${TAG}\`
          - **Host Environment:** \`${TARGET}\` (Native execution on this Android/Linux architecture)
          - **Multi-Arch Code Generation:** Capable of cross-compiling to \`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`, and \`x86\`.
          - **Host Tools:** Native GNU Make 4.4, Native Yasm 1.3.0

          ### Checksums
          \`\`\`
          $(cat build/artifacts/SHA256SUMS 2>/dev/null || true)
          \`\`\`
          EOF

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Custom Android NDK ${{ steps.meta.outputs.release }}"
          body_path: build/RELEASE_NOTES.md
          files: |
            build/artifacts/custom-android-ndk-*.tar.xz
            build/artifacts/*.sha256
            build/artifacts/*.sha512
            build/artifacts/SHA256SUMS
            build/artifacts/SHA512SUMS
          draft: false
          prerelease: false
