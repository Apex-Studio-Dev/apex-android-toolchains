# Apex Toolchains - NDK Releases Metadata
# Exact NDK releases, mapped LLVM revisions, official AOSP bases, and target requirements
version: 1

official_ndk_base_url: "https://dl.google.com/android/repository"

artifact_pattern: "custom-android-ndk-{release}-{target}.tar.xz"
llvm_artifact_pattern: "custom-llvm-{revision}-{target}.tar.xz"

supported_host_platforms:
  bionic:
    targets:
      - "aarch64-linux-android"
      - "armv7a-linux-androideabi"
      - "x86_64-linux-android"
      - "i686-linux-android"
  linux:
    targets:
      - "aarch64-linux-gnu"
      - "armv7a-linux-gnueabihf"
      - "x86_64-linux-gnu"
      - "i686-linux-gnu"

releases:
  - release: "r26"
    tag: "ndk-r26"
    required_llvm: "clang-r487747c"
    llvm_tag: "llvm-r487747c"
    official_archive: "android-ndk-r26-linux.zip"
    official_url: "https://dl.google.com/android/repository/android-ndk-r26-linux.zip"
    targets:
      - "aarch64-linux-android"
      - "armv7a-linux-androideabi"
      - "x86_64-linux-android"
      - "i686-linux-android"

  - release: "r26b"
