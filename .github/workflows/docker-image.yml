name: Build and Publish Builder Image

on:
  workflow_dispatch:
  push:
    paths:
      - docker/Dockerfile
      - .dockerignore
      - .github/workflows/docker-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & Push apex-toolchains-builder
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository owner
        run: |
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Builder Image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/apex-toolchains-builder:latest
            ghcr.io/${{ env.OWNER }}/apex-toolchains-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
