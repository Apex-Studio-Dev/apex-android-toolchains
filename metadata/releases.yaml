# Apex Toolchains - Unified Releases Matrix
# Hosts: Android Bionic & Linux GNU
# Targets: Android ARM64, ARM32, x86_64, x86

project:
  name: "apex-toolchains"
  description: "Monorepo for Custom LLVM/Clang and Custom Android NDK for Android (Bionic) and Linux (GNU) Hosts"
  host_platforms:
    - name: "bionic"
      description: "Native Android Bionic (Termux, PRoot, Android Native)"
      targets:
        - "aarch64-linux-android"
        - "armv7a-linux-androideabi"
        - "x86_64-linux-android"
        - "i686-linux-android"
    - name: "linux"
      description: "Standard GNU/Linux (glibc)"
      targets:
        - "aarch64-linux-gnu"
        - "armv7a-linux-gnueabihf"
        - "x86_64-linux-gnu"
        - "i686-linux-gnu"

dependency_pipeline:
  - step: 1
    name: "fetch_source"
    description: "Fetch exact AOSP llvm-project commit and downstream patches"
  - step: 2
    name: "build_llvm"
    description: "Build native LLVM/Clang toolchain"
  - step: 3
    name: "package_llvm"
    description: "Validate ELF and create custom-llvm-*.tar.xz with individual SHA256"
  - step: 4
    name: "release_llvm"
    description: "Publish to GitHub & GitLab releases with git tag llvm-*"
  - step: 5
    name: "fetch_llvm_artifact"
    description: "NDK fetches pre-released LLVM artifact without recompilation"
  - step: 6
    name: "assemble_ndk"
    description: "Build host tools (make/yasm/toolbox), splice ARM64 LLVM into official NDK base"
  - step: 7
    name: "verify_ndk"
    description: "Compile hello.c for aarch64-linux-android30 and arm-linux-androideabi30; check ELF headers"
  - step: 8
    name: "release_ndk"
    description: "Package custom-android-ndk-*.tar.xz and publish with git tag ndk-*"

artifact_patterns:
  ndk: "custom-android-ndk-{release}-{target}.tar.xz"
  llvm: "custom-llvm-{revision}-{target}.tar.xz"

matrix:
  - ndk_release: "r26"
    ndk_tag: "ndk-r26"
    llvm_revision: "clang-r487747c"
    llvm_tag: "llvm-r487747c"
    llvm_major: 17

  - ndk_release: "r26b"
    ndk_tag: "ndk-r26b"
    llvm_revision: "clang-r487747d"
    llvm_tag: "llvm-r487747d"
    llvm_major: 17

