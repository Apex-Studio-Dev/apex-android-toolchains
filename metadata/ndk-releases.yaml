    tag: "ndk-r26"
    required_llvm: "clang-r487747c"
    llvm_tag: "llvm-r487747c"
    llvm_artifact: "custom-llvm-r487747c-linux-arm64.tar.xz"
    official_archive: "android-ndk-r26-linux.zip"
